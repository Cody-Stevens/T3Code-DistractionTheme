[package]
name = "dt-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
dt-core.workspace = true
# Pure-Rust RGB resizing/filtering; disable native codecs and AVIF's still-only encoders.
image = { version = "0.25", default-features = false }
# Rasterize installed Segoe UI TTFs without shipping font files or adding a native library.
fontdue = "0.9"
# Data URLs carry the encoded bytes inside the CSS/SVG budgets.
base64 = "0.22"
# AVIF is linked from native/ via build.rs: libavif + generic libaom, no NASM or runtime process.

[lints]
workspace = true

# Public-domain bitmap glyphs keep the missing-system-font fallback deterministic.
[dependencies.font8x8]
version = '0.3.1'
# libwebp's optimizing lossless encoder meets the card budget; its C sources build with MSVC.
[dependencies.webp]
version = "0.3.1"

[build-dependencies]
# Build the vendored libaom/libavif C sources with MSVC/CMake and assembly disabled.
cmake = "0.1.58"
# Compressed, reviewable upstream source archives avoid thousands of vendored files.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# Extract the committed source archives into Cargo's private build directory.
tar = "0.4"

[dev-dependencies]
# Independent pure-Rust WebP decoder verifies exact marker pixels after native lossless encoding.
image-webp = "0.2.4"
