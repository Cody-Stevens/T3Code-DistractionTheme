[workspace]
members = ["dt-core", "dt-media", "dt-render", "dt-t3", "dt-platform", "distraction"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
dt-core = { path = "dt-core" }
dt-media = { path = "dt-media" }
dt-render = { path = "dt-render" }
dt-t3 = { path = "dt-t3" }
dt-platform = { path = "dt-platform" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Blocking clients suit the worker threads; rustls avoids an OpenSSL installation on MSVC.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
