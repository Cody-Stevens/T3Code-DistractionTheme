[package]
name = "dt-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
dt-core.workspace = true

# Generated Win32 bindings, Windows-only. GDI reads transient pixel strips; other features cover
# DPI, foreground process identity, clipboard, hotkeys, mutexes, ACLs, and process/job cleanup.
# Unsafe FFI stays in src/win32, not in the other crates.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization",
    "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Memory",
    "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
] }

[lints]
workspace = true
