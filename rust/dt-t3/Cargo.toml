[package]
name = "dt-t3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
dt-core.workspace = true
# Blocking HTTP fits the API/scheduler worker; no async runtime in the 250 ms write loop.
reqwest.workspace = true
# Typed runtime/project/theme JSON; preserve unknown settings fields during atomic replacement.
serde.workspace = true
serde_json.workspace = true
# Random project/command IDs match t3api.py without platform process-global counters.
uuid = { version = "1.18", features = ["v4"] }
# Same-directory temporary files provide atomic replacement on Windows and Unix, with RAII cleanup.
tempfile = "3.23"
# UTC settings timestamps without a platform-specific date command.
time = { version = "=0.3.44", features = ["formatting"] }

[lints]
workspace = true
